apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecart-frontend
  labels:
    app: securecart

spec:
  replicas: 3

  selector:
    matchLabels:
      app: securecart
      component: frontend

  template:
    metadata:
      labels:
        app: securecart
        component: frontend

    spec:
      containers:
        - name: frontend
          image: securecart-frontend:0.1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: securecart-config
                  key: APP_NAME

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: securecart-config
                  key: ENVIRONMENT

            - name: VERSION
              valueFrom:
                configMapKeyRef:
                  name: securecart-config
                  key: VERSION

            - name: COMPANY
              valueFrom:
                configMapKeyRef:
                  name: securecart-config
                  key: COMPANY

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name