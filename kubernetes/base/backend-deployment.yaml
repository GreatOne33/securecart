apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecart-backend
  labels:
    app: securecart
    component: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: securecart
      component: backend

  template:
    metadata:
      labels:
        app: securecart
        component: backend

    spec:
      containers:
        - name: backend
          image: securecart-backend:0.2.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: APP_NAME
              value: "SecureCart Backend"

            - name: API_VERSION
              value: "0.1.0"

            - name: ENVIRONMENT
              value: "Staging"

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: DB_HOST
              value: "securecart-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: securecart-postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: securecart-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securecart-postgres-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"