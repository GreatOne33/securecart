name: SecureCart CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: app/backend
        run: |
          python -m compileall .

      - name: Validate FastAPI application import
        working-directory: app/backend
        run: |
          python -c "import main; print('FastAPI application import successful')"

  container-build-validation:
    name: Container Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend container
        run: |
          docker build \
            -t securecart-backend:ci \
            app/backend

      - name: Build frontend container
        run: |
          docker build \
            -t securecart-frontend:ci \
            app/frontend

  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Lint Helm chart
        run: |
          helm lint helm/securecart

      - name: Render Helm manifests
        run: |
          helm template securecart \
            helm/securecart \
            > /tmp/securecart-rendered.yaml

      - name: Verify rendered manifests
        run: |
          test -s /tmp/securecart-rendered.yaml
          grep '^kind:' /tmp/securecart-rendered.yaml