# Default values for the SecureCart Helm chart.

global:
  appName: SecureCart
  environment: Staging
  company: GreatOne Labs

frontend:
  replicaCount: 3

  image:
    repository: ghcr.io/greatone33/securecart-frontend
    tag: "0.3.3"
    pullPolicy: Always

  containerPort: 8080

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

backend:
  replicaCount: 2

  image:
    repository: ghcr.io/greatone33/securecart-backend
    tag: "0.4.2"
    pullPolicy: Always

  containerPort: 8000

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

postgres:
  image:
    repository: postgres
    tag: "17-alpine"

  containerPort: 5432

  service:
    port: 5432

  existingSecret: securecart-postgres-secret

  persistence:
    storageClass: standard
    accessMode: ReadWriteOnce
    size: 1Gi

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

migration:
  enabled: true
  backoffLimit: 3

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: securecart.local

  tls:
    enabled: true
    secretName: securecart-tls