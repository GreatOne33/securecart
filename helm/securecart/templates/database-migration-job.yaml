{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job

metadata:
  name: securecart-db-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: securecart
    component: database-migration

spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}

  template:
    metadata:
      labels:
        app: securecart
        component: database-migration

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      restartPolicy: Never

      containers:
        - name: migration
          image: {{ include "securecart.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e
              alembic upgrade head
              python seed.py

          env:
            - name: DB_HOST
              value: "securecart-postgres"

            - name: DB_PORT
              value: {{ .Values.postgres.service.port | quote }}

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
{{- end }}